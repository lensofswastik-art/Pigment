<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Pigment — File Drop Interaction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      background: #EFF0F0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Upload zone ── */
    .upload-zone {
      background: transparent;
      border-radius: 14px;
      padding: 36px 56px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    /* ── 4-state icon ── */
    .file-icon-wrap {
      position: relative;
      width: 204px;
      height: 126px;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .upload-zone:hover .file-icon-wrap {
      transform: translateY(-6px);
    }

    .file-icon-wrap .fi-default,
    .file-icon-wrap .fi-hover,
    .file-icon-wrap .fi-uploaded,
    .file-icon-wrap .fi-uploaded-hover {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      transition: opacity 0.3s ease;
    }

    .file-icon-wrap .fi-hover {
      opacity: 0;
    }

    .file-icon-wrap .fi-uploaded {
      opacity: 0;
    }

    .file-icon-wrap .fi-uploaded-hover {
      opacity: 0;
    }

    /* no-file + hover */
    .upload-zone:not(.has-file):hover .file-icon-wrap .fi-hover {
      opacity: 1;
    }

    .upload-zone:not(.has-file):hover .file-icon-wrap .fi-default {
      opacity: 0;
    }

    /* has-file + idle */
    .upload-zone.has-file:not(:hover) .file-icon-wrap .fi-uploaded {
      opacity: 1;
    }

    .upload-zone.has-file .file-icon-wrap .fi-default {
      opacity: 0;
    }

    /* has-file + hover */
    .upload-zone.has-file:hover .file-icon-wrap .fi-uploaded-hover {
      opacity: 1;
    }

    .upload-zone.has-file:hover .file-icon-wrap .fi-uploaded {
      opacity: 0;
    }

    /* ── Zone label / filename crossfade ── */
    .zone-text-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
    }

    .zone-label {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-size: 14px;
      font-weight: 500;
      color: #6C757D;
      letter-spacing: -0.03em;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    .zone-loaded {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .zone-loaded span {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-size: 14px;
      font-weight: 500;
      color: #6C757D;
      letter-spacing: -0.03em;
    }

    .upload-zone.has-file .zone-label {
      opacity: 0;
    }

    .upload-zone.has-file .zone-loaded {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Clear button ── */
    .btn-clear {
      width: 22px;
      height: 22px;
      border-radius: 11px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #E9ECEF 0%, #EFF1F3 100%);
      border: 1px solid #CED4DA;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        0px -1px 1px 0px rgba(254, 254, 255, 0.6),
        inset 0px -1px 0px 0.16px #ADB5BD,
        inset 0px 1px 0.49px 0px #FFFFFF;
      transition: opacity 0.15s;
      padding: 0;
    }

    .btn-clear:hover {
      opacity: 0.7;
    }
  </style>
</head>

    var zone = document.getElementById('uploadZone');

    zone.addEventListener('click', function () {

      e.stopPropagation();
      zone.classList.remove('has-file');
    });
